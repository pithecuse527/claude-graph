<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
  <!-- trunk -->
  <path d="M6 3.5v17"/>
  <!-- one retry, dashed, ending in a hollow dot -->
