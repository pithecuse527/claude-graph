  <!-- one branch, solid, running down its own lane -->
  <path d="M6 14c0 2.2 2.6 2.4 5 2.4h1.5v4"/>
  <circle cx="6" cy="3.5" r="1.9" fill="currentColor" stroke="none"/>
  <circle cx="6" cy="20.5" r="1.9" fill="currentColor" stroke="none"/>
  <circle cx="13.5" cy="11.2" r="1.7"/>
  <rect x="16.1" y="18.6" width="3.8" height="3.8" transform="rotate(45 18 20.5)"
        fill="currentColor" stroke="none"/>
</svg>
